[workspace]
resolver = "2"
members = ["crates/coshell-term", "crates/coshell-ssh", "crates/coshell-ai", "crates/coshell-app"]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
iced = { version = "=0.14.0", features = ["advanced", "tokio", "svg", "image"] }
unicode-width = "0.2"
alacritty_terminal = "=0.26.0"
portable-pty = "0.9.0"
futures = "0.3"
anyhow = "1"
russh = "=0.65.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util"] }
zeroize = "1"

[profile.dev.package."*"]
opt-level = 2
