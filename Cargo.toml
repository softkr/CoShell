[workspace]
resolver = "2"
members = ["crates/coshell-term", "crates/coshell-ssh", "crates/coshell-ai", "crates/coshell-app"]

[workspace.package]
version = "0.5.16"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
iced = { version = "=0.14.0", features = ["advanced", "tokio", "svg", "image", "canvas", "selector"] }
unicode-width = "0.2"
alacritty_terminal = "=0.26.0"
portable-pty = "0.9.0"
futures = "0.3"
anyhow = "1"
russh = "=0.65.1"
russh-sftp = "=4.0.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util", "fs"] }
zeroize = "1"

[profile.dev.package."*"]
opt-level = 2

# winit 0.30.13 plus one fix: the first key after switching to Apple's Korean input method
# composes instead of arriving as a bare jamo (vendor/winit/COSHELL_PATCH.md). Drop this once
# a winit release carries rust-windowing/winit#4744.
[patch.crates-io]
winit = { path = "vendor/winit" }
iced_wgpu = { path = "vendor/iced_wgpu" }
