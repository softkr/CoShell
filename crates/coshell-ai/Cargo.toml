[package]
name = "coshell-ai"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Chat providers (Anthropic Messages / OpenAI Chat Completions) with streaming, for CoShell"

[dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["default-tls", "http2", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures.workspace = true
zeroize.workspace = true
keyring = "4.2.0"
toml = "1.2.1"
regex = "1"

[dev-dependencies]
tokio.workspace = true
tempfile = "3"
