# Release builds: macOS (Apple Silicon only, DMG), Windows (x64, zip), Linux (x86_64, tar.gz).
# Every archive gets a `.sha256` file next to it; the app's updater checks the DMG against it.
#
# - Pull requests: build only, so a change that breaks a platform shows up before merging.
# - Pushing a `v*` tag: build all three, then attach the files to that tag's release and only
#   then publish it. Write the notes in a draft release for the tag meanwhile; without one, a
#   release with generated notes is created. Never published without its files, so the in-app
#   updater never sees a release it cannot install.
# - Manual run: rebuild and re-attach for an existing tag.
name: Release builds

on:
  pull_request:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and attach to (e.g. v0.4.1)
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-latest # Apple Silicon
          - name: windows-x86_64
            os: windows-latest
          - name: linux-x86_64
            os: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG || github.ref }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libxkbcommon-dev

      - name: NASM (aws-lc on Windows)
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1

      - name: Tag matches the crate version
        if: env.TAG != ''
        shell: bash
        run: |
          v="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          [ "v$v" = "$TAG" ] || { echo "tag $TAG but Cargo.toml says $v" >&2; exit 1; }

      - name: Build
        if: runner.os != 'macOS'
        run: cargo build --release --locked -p coshell-app

      - name: Build app bundle (macOS)
        if: runner.os == 'macOS'
        run: scripts/bundle-macos.sh

      - name: Package (macOS)
        if: runner.os == 'macOS' && env.TAG != ''
        run: |
          dmg="$(scripts/package-dmg.sh | tail -1)"
          name="$(basename "$dmg")"
          mkdir -p dist && cp "$dmg" "dist/$name"
          (cd dist && shasum -a 256 "$name" > "$name.sha256")

      - name: Package (Windows)
        if: runner.os == 'Windows' && env.TAG != ''
        shell: pwsh
        run: |
          $v = "$env:TAG".TrimStart('v')
          $name = "CoShell-$v-windows-x86_64"
          New-Item -ItemType Directory -Path $name | Out-Null
          Copy-Item target/release/coshell.exe "$name/CoShell.exe"
          Copy-Item README.md, LICENSE $name
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Compress-Archive -Path $name -DestinationPath "dist/$name.zip"
          (Get-FileHash "dist/$name.zip" -Algorithm SHA256).Hash.ToLower() + "  $name.zip" | Out-File -Encoding ascii "dist/$name.zip.sha256"

      - name: Package (Linux)
        if: runner.os == 'Linux' && env.TAG != ''
        run: |
          v="${TAG#v}"
          name="CoShell-$v-linux-x86_64"
          mkdir -p "$name"
          cp target/release/coshell "$name/"
          cp packaging/linux/coshell.desktop "$name/"
          cp crates/coshell-app/assets/png/coshell-256.png "$name/coshell.png"
          cp README.md LICENSE "$name/"
          mkdir -p dist
          tar -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")

      - name: Keep the files for publishing
        if: env.TAG != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: publish
    needs: build
    if: github.ref_type == 'tag' || inputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Attach the files, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          ls -la dist
          if gh release view "$TAG" -R "$REPO" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* -R "$REPO" --clobber
            gh release edit "$TAG" -R "$REPO" --draft=false
          else
            gh release create "$TAG" dist/* -R "$REPO" --title "CoShell ${TAG#v}" --generate-notes
          fi
